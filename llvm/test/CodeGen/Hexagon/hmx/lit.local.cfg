# Gate HMX numerical correctness on Hexagon SDK Tools + QuRT sim.
#
# Without SDK Tools (or libncurses for hexagon-sim), this directory is
# UNSUPPORTED — parent Hexagon FileCheck lit stays green.
#
# Env (first hit wins for tools root):
#   HEXAGON_TOOLS, HEXAGON_TOOLCHAIN, HEXAGON_TOOLS_HOME
#   HEXAGON_SDK_ROOT / HEXAGON_SDK

import glob
import os
import subprocess

config.suffixes = [".test"]


def _which(name, roots):
    for root in roots:
        if not root:
            continue
        for cand in (
            os.path.join(root, "bin", name),
            os.path.join(root, "Tools", "bin", name),
        ):
            if os.path.isfile(cand) and os.access(cand, os.X_OK):
                return cand
    return None


def _sdk_roots():
    roots = []
    explicit = False
    for key in ("HEXAGON_SDK_ROOT", "HEXAGON_SDK"):
        v = os.environ.get(key)
        if v is not None:
            explicit = True
            if v and os.path.isdir(v):
                roots.append(v)
    # Project-common installs only when the user did not set SDK env.
    if not explicit:
        for p in (
            "/local/mnt/workspace/Qualcomm/Hexagon_SDK/6.4.0.1",
            "/opt/qcom/Hexagon_SDK/6.4.0.1",
        ):
            if os.path.isdir(p):
                roots.append(p)
    return roots


def _tools_roots(sdk_roots):
    roots = []
    for key in ("HEXAGON_TOOLS", "HEXAGON_TOOLCHAIN", "HEXAGON_TOOLS_HOME"):
        v = os.environ.get(key)
        if v:
            roots.append(v)
    for sdk in sdk_roots:
        for pat in (
            os.path.join(sdk, "tools", "HEXAGON_Tools", "*", "Tools"),
            os.path.join(sdk, "tools", "HEXAGON_Tools", "*"),
        ):
            roots.extend(sorted(glob.glob(pat), reverse=True))
    return roots


def _probe_sim(sim):
    try:
        r = subprocess.run(
            [sim, "--help"],
            stdout=subprocess.DEVNULL,
            stderr=subprocess.PIPE,
            timeout=30,
            check=False,
        )
        err = r.stderr.decode("utf-8", "replace")
        if "libncurses" in err or "error while loading shared libraries" in err:
            return False
        return True
    except (OSError, subprocess.TimeoutExpired):
        return False


sdk_roots = _sdk_roots()
tools_roots = _tools_roots(sdk_roots)
sim = _which("hexagon-sim", tools_roots)
clang = _which("hexagon-clang", tools_roots)
ar = _which("hexagon-ar", tools_roots)

qurt = None
run_main = None
test_util = None
tools_home = None

for sdk in sdk_roots:
    cand = os.path.join(sdk, "rtos", "qurt", "computev79")
    if os.path.isfile(os.path.join(cand, "sdksim_bin", "runelf.pbn")):
        qurt = cand
        break

for sdk in sdk_roots:
    for pat in (
        os.path.join(
            sdk,
            "libs",
            "run_main_on_hexagon",
            "ship",
            "hexagon_toolv19_v79",
            "run_main_on_hexagon_sim",
        ),
        os.path.join(
            sdk, "libs", "run_main_on_hexagon", "ship", "*", "run_main_on_hexagon_sim"
        ),
    ):
        hits = sorted(glob.glob(pat), reverse=True)
        if hits and os.path.isfile(hits[0]):
            run_main = hits[0]
            break
    if run_main:
        break

for sdk in sdk_roots:
    for pat in (
        os.path.join(
            sdk, "utils", "sim_utils", "prebuilt", "hexagon_toolv19_v68", "test_util.a"
        ),
        os.path.join(sdk, "utils", "sim_utils", "prebuilt", "*", "test_util.a"),
    ):
        hits = sorted(glob.glob(pat), reverse=True)
        if hits and os.path.isfile(hits[0]):
            test_util = hits[0]
            break
    if test_util:
        break

for root in tools_roots:
    if os.path.isdir(os.path.join(root, "bin")):
        tools_home = root
        break
    if os.path.isdir(os.path.join(root, "Tools", "bin")):
        tools_home = os.path.join(root, "Tools")
        break

ready = (
    sim
    and clang
    and ar
    and qurt
    and run_main
    and test_util
    and tools_home
    and _probe_sim(sim)
)

def _probe_f8_drain(sim_bin, clang_bin):
    """True only when hexagon-sim can execute V81 f8 drain without exception.

    Tools 19.0.04 --mhmx on QuRT v79/v81 currently traps on cvt.f8=acc /
    mxmem.f8=cvt (SSR precise exception). Override with HEXAGON_HMX_F8_SIM=1
    after a manual smoke that prints PASS, so the numerical lit can enable.
    """
    force = os.environ.get("HEXAGON_HMX_F8_SIM", "").strip()
    if force in ("1", "true", "yes", "on"):
        return True
    if force in ("0", "false", "no", "off"):
        return False
    # Default: assembler accepts the opcodes (IR is wired) but do *not*
    # claim sim numerical support — that needs a green smoke first.
    try:
        r = subprocess.run(
            [clang_bin, "-mv81", "-mhmx", "-c", "-x", "assembler", "-o", os.devnull],
            input="{ cvt.f8 = acc(r0) }\n{ mxmem(r0,r1).f8 = cvt }\n",
            text=True,
            stdout=subprocess.DEVNULL,
            stderr=subprocess.PIPE,
            timeout=30,
            check=False,
        )
        # Assembler OK is necessary but not sufficient for the lit feature.
        _ = r.returncode == 0
    except (OSError, subprocess.TimeoutExpired):
        pass
    return False


if not ready:
    config.unsupported = True
else:
    config.available_features.add("hexagon-sim-hmx")
    if _probe_f8_drain(sim, clang):
        config.available_features.add("hexagon-sim-hmx-f8")
    iss = os.path.join(tools_home, "lib", "iss")
    qurt_model = os.path.join(qurt, "debugger", "lnx64", "qurt_model.so")
    runelf = os.path.join(qurt, "sdksim_bin", "runelf.pbn")
    sdk0 = sdk_roots[0]

    # Longer keys first: lit substitutes the first matching prefix.
    config.substitutions.append(
        (
            "%hexagon-qurt-includes",
            f"-I{qurt}/include -I{qurt}/include/qurt",
        )
    )
    config.substitutions.append(
        ("%hexagon-sdk-includes", f"-I{sdk0}/incs -I{sdk0}/incs/stddef")
    )
    config.substitutions.append(("%hexagon-qurt-model", qurt_model))
    config.substitutions.append(("%hexagon-run-main", run_main))
    config.substitutions.append(("%hexagon-test-util", test_util))
    config.substitutions.append(("%hexagon-runelf", runelf))
    config.substitutions.append(("%hexagon-clang", clang))
    config.substitutions.append(("%hexagon-sim", sim))
    config.substitutions.append(("%hexagon-ar", ar))
    config.substitutions.append(("%hexagon-iss", iss))
    config.substitutions.append(("%hexagon-qurt", qurt))
